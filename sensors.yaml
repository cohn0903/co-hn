# Template Sensors for Family Dashboard
# Add this to your configuration.yaml under template: section
# or include it via: template: !include sensors.yaml

- sensor:
    # School Departure Countdown
    # Customize target_hour and target_minute to match your school departure time
    - name: "School Departure Countdown"
      unique_id: school_departure_countdown
      state: >
        {% set target_hour = 7 %}
        {% set target_minute = 15 %}
        {% set now_time = now() %}
        {% set weekday = now_time.weekday() %}

        {# Skip weekends #}
        {% if weekday >= 5 %}
          weekend
        {% else %}
          {% set target = now_time.replace(hour=target_hour, minute=target_minute, second=0, microsecond=0) %}
          {% if now_time >= target %}
            departed
          {% else %}
            {% set diff = (target - now_time).total_seconds() | int %}
            {% set hours = (diff // 3600) | int %}
            {% set minutes = ((diff % 3600) // 60) | int %}
            {% set seconds = (diff % 60) | int %}
            {{ hours }}:{{ '%02d' | format(minutes) }}:{{ '%02d' | format(seconds) }}
          {% endif %}
        {% endif %}
      attributes:
        target_time: "7:15 AM"
        hours_remaining: >
          {% set target_hour = 7 %}
          {% set target_minute = 15 %}
          {% set now_time = now() %}
          {% set target = now_time.replace(hour=target_hour, minute=target_minute, second=0, microsecond=0) %}
          {% if now_time >= target or now_time.weekday() >= 5 %}
            0
          {% else %}
            {{ ((target - now_time).total_seconds() // 3600) | int }}
          {% endif %}
        minutes_remaining: >
          {% set target_hour = 7 %}
          {% set target_minute = 15 %}
          {% set now_time = now() %}
          {% set target = now_time.replace(hour=target_hour, minute=target_minute, second=0, microsecond=0) %}
          {% if now_time >= target or now_time.weekday() >= 5 %}
            0
          {% else %}
            {{ (((target - now_time).total_seconds() % 3600) // 60) | int }}
          {% endif %}
        seconds_remaining: >
          {% set target_hour = 7 %}
          {% set target_minute = 15 %}
          {% set now_time = now() %}
          {% set target = now_time.replace(hour=target_hour, minute=target_minute, second=0, microsecond=0) %}
          {% if now_time >= target or now_time.weekday() >= 5 %}
            0
          {% else %}
            {{ ((target - now_time).total_seconds() % 60) | int }}
          {% endif %}
        total_minutes_remaining: >
          {% set target_hour = 7 %}
          {% set target_minute = 15 %}
          {% set now_time = now() %}
          {% set target = now_time.replace(hour=target_hour, minute=target_minute, second=0, microsecond=0) %}
          {% if now_time >= target or now_time.weekday() >= 5 %}
            0
          {% else %}
            {{ ((target - now_time).total_seconds() // 60) | int }}
          {% endif %}
      icon: mdi:bus-school

    # Current Time Display
    - name: "Current Time Display"
      unique_id: current_time_display
      state: "{{ now().strftime('%I:%M %p') }}"
      icon: mdi:clock-digital

# Note: The team tracker sensor (sensor.team_tracker) is provided by the
# Team Tracker integration from HACS. Install it from:
# https://github.com/vasqued2/ha-teamtracker
#
# Configuration for Team Tracker is done through the UI:
# Settings -> Devices & Services -> Add Integration -> Team Tracker
# Select "NBA" as the league and "Houston Rockets" as the team
#
# The sensor.team_tracker entity provides attributes like:
# - team_name: Team name
# - opponent_name: Opponent name
# - team_score: Current score
# - opponent_score: Opponent score
# - date: Game date
# - kickoff_in: Time until game starts
# - venue: Game location
# - broadcast: TV channel
# - state: IN, PRE, POST, NOT_FOUND
