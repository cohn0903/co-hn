# Automations for Family Dashboard
# Add these to your automations.yaml or create via the UI

# School Departure Warning - 15 minutes before
- id: school_departure_15min_warning
  alias: "School Departure - 15 Minute Warning"
  description: "Alert 15 minutes before school departure time"
  trigger:
    - platform: template
      value_template: >
        {{ state_attr('sensor.school_departure_countdown', 'total_minutes_remaining') | int == 15 }}
  condition:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
  action:
    - service: light.turn_on
      target:
        entity_id: light.kitchen
      data:
        color_name: yellow
        brightness: 255
    - service: tts.speak
      target:
        entity_id: tts.google_en_com
      data:
        cache: false
        media_player_entity_id: media_player.living_room
        message: "15 minutes until school departure time!"
  mode: single

# School Departure Warning - 5 minutes before
- id: school_departure_5min_warning
