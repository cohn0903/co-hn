title: Family Dashboard
views:
  - title: Home
    path: home
    type: custom:grid-layout
    layout:
      grid-template-columns: 1fr 1fr 1fr
      grid-template-rows: auto auto auto
      grid-gap: 16px
      padding: 16px
    badges: []
    cards:
      # Weather Section
      - type: custom:bubble-card
        card_type: separator
        name: Weather
        icon: mdi:weather-partly-cloudy
        styles: |
          .separator {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(139, 92, 246, 0.3));
            border-radius: 16px;
            backdrop-filter: blur(10px);
          }

      # Weather Chart Card - Forecast with chart
      - type: custom:weather-chart-card
        entity: weather.forecast_home
        show_main: true
        show_temperature: true
        show_current_condition: true
        show_attributes: true
        show_humidity: true
        show_pressure: true
        show_wind_direction: true
        show_wind_speed: true
        show_sun: true
        show_forecast: true
        forecast_type: daily
        number_of_forecasts: 5
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.8));
              border-radius: 20px;
              border: 1px solid rgba(255, 255, 255, 0.1);
              backdrop-filter: blur(10px);
            }

      # Weather Radar Card - Local radar view
      - type: custom:weather-radar-card
        data_source: RainViewer
        show_marker: true
        show_range: true
        show_zoom: true
        show_recenter: true
        show_playback: true
        square_map: false
        show_scale: true
        zoom_level: 8
        center_latitude: 29.6686
        center_longitude: -95.4838
        marker_latitude: 29.6686
        marker_longitude: -95.4838
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.8));
              border-radius: 20px;
              border: 1px solid rgba(255, 255, 255, 0.1);
              backdrop-filter: blur(10px);
            }

      # Calendar Section
      - type: custom:bubble-card
        card_type: separator
        name: Calendar
        icon: mdi:calendar

      # Week Planner Card
      - type: custom:week-planner-card
        calendars:
          - entity: calendar.cohn_shared_calendar
            color: "#6366f1"
        days: 7
        startingDay: today
        hideWeekend: false
        noCardBackground: false
        eventBackground: rgba(99, 102, 241, 0.3)
        showLocation: true
        showDescription: false
        locationIcon: mdi:map-marker
        hidePastEvents: true
        hideDaysWithoutEvents: false
        showEventIcon: true
        showTime: true
        timeFormat: h:mm A
        dateFormat: ddd, MMM D
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.8));
              border-radius: 20px;
              border: 1px solid rgba(255, 255, 255, 0.1);
              backdrop-filter: blur(10px);
            }

      # Houston Rockets Section
      - type: custom:bubble-card
        card_type: separator
        name: Houston Rockets
        icon: mdi:basketball

      # Team Tracker Card - Official card for sensor.team_tracker
      - type: custom:teamtracker-card
        entity: sensor.team_tracker
        home_side: left
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(206, 17, 65, 0.3), rgba(196, 206, 211, 0.2));
              border-radius: 20px;
              border: 1px solid rgba(206, 17, 65, 0.3);
              backdrop-filter: blur(10px);
            }

      # Game Details Card
      - type: markdown
        content: |
          {% if state_attr('sensor.team_tracker', 'date') %}
          **Next Game:** {{ state_attr('sensor.team_tracker', 'date') }}
          {% endif %}
          {% if state_attr('sensor.team_tracker', 'kickoff_in') %}
          **Starts in:** {{ state_attr('sensor.team_tracker', 'kickoff_in') }}
          {% endif %}
          {% if state_attr('sensor.team_tracker', 'venue') %}
          **Venue:** {{ state_attr('sensor.team_tracker', 'venue') }}
          {% endif %}
          {% if state_attr('sensor.team_tracker', 'broadcast') %}
          **Watch:** {{ state_attr('sensor.team_tracker', 'broadcast') }}
          {% endif %}
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.8));
              border-radius: 16px;
              border: 1px solid rgba(255, 255, 255, 0.1);
              backdrop-filter: blur(10px);
            }

      # School Countdown Section
      - type: custom:bubble-card
        card_type: separator
        name: School Countdown
        icon: mdi:school

      # Timer Bar Card for School Departure
      - type: custom:timer-bar-card
        entity: sensor.school_departure_countdown
        name: Time Until Departure
        icon: mdi:bus-school
        bar_direction: right
        bar_radius: 8px
        bar_height: 12px
        modifications:
          - elapsed: 75%
            bar_foreground: orange
          - elapsed: 90%
            bar_foreground: red
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.8));
              border-radius: 16px;
              border: 1px solid rgba(255, 255, 255, 0.1);
              backdrop-filter: blur(10px);
            }

      # Current Time Display
      - type: custom:mushroom-template-card
        primary: "{{ now().strftime('%I:%M %p') }}"
        secondary: "{{ now().strftime('%A, %B %d, %Y') }}"
        icon: mdi:clock-outline
        icon_color: blue
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.8));
              border-radius: 16px;
              border: 1px solid rgba(255, 255, 255, 0.1);
              backdrop-filter: blur(10px);
            }
